<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香港隧道收費計算器</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap">
    <nav class="topbar" aria-label="Language">
      <div class="lang-picker" id="lang-picker">
        <button type="button" class="lang-trigger" id="lang-trigger"
                aria-haspopup="listbox" aria-expanded="false" aria-label="語言">
          <svg class="lang-globe" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"
                  fill="none" stroke="currentColor" stroke-width="1.8"></path>
          </svg>
          <span id="lang-current">繁體中文</span>
          <svg class="lang-chevron" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
        <ul class="lang-menu" id="lang-menu" role="listbox" hidden></ul>
      </div>
    </nav>

    <section class="card" id="result-card">
      <div class="result-head">
        <div>
          <h1 id="result-title">—</h1>
          <p class="subtitle" id="result-subtitle">—</p>
        </div>
        <span class="badge" id="period-badge">—</span>
      </div>
      <p class="price"><span class="currency">HK$</span><span id="price-amount">0.00</span></p>
      <div class="hint" id="next-hint" hidden></div>
    </section>

    <div class="view-tabs" id="view-tabs" role="tablist">
      <button type="button" role="tab" data-view="fares" aria-selected="true">收費比較</button>
      <button type="button" role="tab" data-view="journey" aria-selected="false">行程建議</button>
      <button type="button" role="tab" data-view="schedule" aria-selected="false">時間表</button>
    </div>

    <div class="view-panel" id="view-fares">
    <section class="card" id="compare-card">
      <h2 id="compare-title">隧道收費比較</h2>
      <div class="compare-picks" id="compare-picks"></div>
      <ul class="compare-list" id="compare-list"></ul>
      <p class="compare-note" id="compare-note" hidden></p>
      <p class="compare-empty" id="compare-empty" hidden>呢條隧道唔係過海隧道，冇得比較。</p>
    </section>
    </div>

    <div class="view-panel" id="view-journey" hidden>
      <section class="card" id="plan-card">
        <h2 id="plan-title">行程建議</h2>
        <div class="field-row">
          <label class="field">
            <span class="field-label" id="label-from">起點</span>
            <select id="from-select"></select>
          </label>
          <label class="field">
            <span class="field-label" id="label-to">終點</span>
            <select id="to-select"></select>
          </label>
        </div>
        <div class="plan-result" id="plan-result"></div>
      </section>
    </div>

    <div class="view-panel" id="view-schedule" hidden>
    <section class="card" id="chart-card">
      <div class="chart-head">
        <h2 id="chart-title">24小時收費時段分佈圖</h2>
        <span class="now-label"><span id="now-date">—</span> <strong id="now-time">--:--</strong></span>
      </div>
      <div class="chart" id="chart">
        <div class="chart-bar" id="chart-bar"></div>
        <div class="chart-marker" id="chart-marker"></div>
      </div>
      <div class="chart-axis">
        <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:59</span>
      </div>
      <ul class="legend" id="legend"></ul>
    </section>
    </div>

    <section class="card form-card">
      <div class="field-row">
        <label class="field">
          <span class="field-label" id="label-tunnel">選擇隧道</span>
          <select id="tunnel-select"></select>
        </label>
        <label class="field">
          <span class="field-label" id="label-vehicle">車輛類別</span>
          <select id="vehicle-select"></select>
        </label>
      </div>

      <div class="field">
        <div class="segmented mode-toggle" id="mode-toggle">
          <button type="button" data-mode="date">指定日期</button>
          <button type="button" data-mode="category">日期類型</button>
        </div>
      </div>

      <div class="field" id="date-field">
        <span class="field-label" id="label-date">日期</span>
        <input id="date-input" class="date-input" type="date">
      </div>

      <div class="field" id="category-field">
        <span class="field-label" id="label-category">日期類型</span>
        <div class="segmented" id="daytype-toggle">
          <button type="button" data-daytype="weekday">星期一至六（非假期）</button>
          <button type="button" data-daytype="weekend">星期日及公眾假期</button>
        </div>
      </div>

      <div class="field">
        <div class="time-row">
          <span class="field-label" id="label-time">通行時間</span>
          <button type="button" class="link-btn" id="back-to-now">回到現在</button>
        </div>
        <div class="time-selects">
          <select id="hour-select" aria-label="小時"></select>
          <span class="time-colon">:</span>
          <select id="minute-select" aria-label="分鐘"></select>
        </div>
        <input id="time-slider" type="range" min="0" max="1439" step="1" value="0" aria-label="時間滑桿">
      </div>

      <p class="notice" id="holiday-notice" hidden></p>
    </section>

    <footer class="site-footer" id="site-footer"></footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
