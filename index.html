<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香港隧道收費計算器</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap" id="wrap">
    <nav class="topbar" aria-label="Language">
      <div class="lang-picker" id="lang-picker">
        <button type="button" class="lang-trigger" id="lang-trigger"
                aria-haspopup="listbox" aria-expanded="false" aria-label="語言">
          <svg class="lang-globe" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"
                  fill="none" stroke="currentColor" stroke-width="1.8"></path>
          </svg>
          <span id="lang-current">繁體中文</span>
          <svg class="lang-chevron" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
        <ul class="lang-menu" id="lang-menu" role="listbox" hidden></ul>
      </div>
    </nav>

    <section class="card" id="alt-card" hidden>
      <div class="alt-head">
        <label class="alt-vehicle">
          <span class="alt-vehicle-label" id="label-vehicle-class">車種</span>
          <select id="vehicle-select" class="inline-select" aria-label="車輛類別"></select>
        </label>
      </div>
      <div class="pick-chips" id="alt-categories"></div>
      <ul class="alt-list" id="alt-list"></ul>
      <p class="compare-note" id="compare-note" hidden></p>
      <div id="traffic-footnote"></div>
      <p class="notice" id="holiday-notice" hidden></p>
    </section>

    <section class="card" id="chart-card">
      <div class="chart-head">
        <h2 id="chart-title">24小時收費時段分佈圖</h2>
        <span class="badge" id="period-badge">—</span>
        <p class="chart-tunnel" id="chart-tunnel">海底隧道（紅隧）</p>
        <div class="chart-controls">
          <button type="button" class="now-pill" id="back-to-now">回到現在</button>
          <input id="date-input" class="date-input" type="date" aria-label="日期">
          <span class="time-selects">
            <select id="hour-select" class="inline-select" aria-label="小時"></select>
            <span class="time-colon">:</span>
            <select id="minute-select" class="inline-select" aria-label="分鐘"></select>
          </span>
          <select id="daytype-select" class="inline-select" aria-label="日期類型"></select>
        </div>
      </div>
      <div class="chart" id="chart">
        <span class="marker-label" id="marker-label"></span>
        <div class="chart-bar" id="chart-bar"></div>
        <div class="chart-marker" id="chart-marker"></div>
        <input id="time-slider" type="range" min="0" max="1439" step="1" value="0" aria-label="通行時間">
      </div>
      <div class="chart-axis">
        <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:59</span>
      </div>
      <ul class="legend" id="legend"></ul>
      <div class="hint" id="next-hint" hidden></div>
    </section>

    <footer class="site-footer" id="site-footer"></footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
