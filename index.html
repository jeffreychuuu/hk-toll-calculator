<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香港隧道收費計算器</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap">
    <section class="card" id="result-card">
      <div class="result-head">
        <div>
          <h1 id="result-title">—</h1>
          <p class="subtitle" id="result-subtitle">—</p>
        </div>
        <span class="badge" id="period-badge">—</span>
      </div>
      <p class="price"><span class="currency">HK$</span><span id="price-amount">0.00</span></p>
      <div class="hint" id="next-hint" hidden></div>
    </section>

    <section class="card" id="chart-card">
      <div class="chart-head">
        <h2>24小時收費時段分佈圖</h2>
        <span class="now-label">當前時間 <strong id="now-time">--:--</strong></span>
      </div>
      <div class="chart" id="chart">
        <div class="chart-bar" id="chart-bar"></div>
        <div class="chart-marker" id="chart-marker"></div>
      </div>
      <div class="chart-axis">
        <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:59</span>
      </div>
      <ul class="legend" id="legend"></ul>
    </section>

    <section class="card form-card">
      <div class="field-row">
        <label class="field">
          <span class="field-label">選擇隧道</span>
          <select id="tunnel-select"></select>
        </label>
        <label class="field">
          <span class="field-label">車輛類別</span>
          <select id="vehicle-select"></select>
        </label>
      </div>

      <div class="field">
        <span class="field-label">日期類型</span>
        <div class="segmented" id="daytype-toggle">
          <button type="button" data-daytype="weekday">星期一至六（非假期）</button>
          <button type="button" data-daytype="weekend">星期日及公眾假期</button>
        </div>
      </div>

      <div class="field">
        <div class="time-row">
          <span class="field-label">過海／通行時間</span>
          <span class="time-pill">
            <input id="time-input" type="text" inputmode="numeric" value="--:--" aria-label="通行時間">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle>
              <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            </svg>
          </span>
        </div>
        <input id="time-slider" type="range" min="0" max="1439" step="1" value="0" aria-label="時間滑桿">
      </div>

      <p class="notice" id="holiday-notice" hidden>
        公眾假期資料只涵蓋 2025–2027 年，請手動確認日期類型。
      </p>
    </section>

    <footer class="site-footer">
      資料來源：香港特別行政區政府運輸署 —
      <a href="https://www.td.gov.hk/tc/transport_in_hong_kong/tunnels_and_bridges_n/tvt/index.html" target="_blank" rel="noopener">分時段收費</a>、
      <a href="https://www.td.gov.hk/tc/transport_in_hong_kong/tunnels_and_bridges_n/toll_matters/toll_rates_of_road_tunnels_and_lantau_link/index.html" target="_blank" rel="noopener">行車隧道嘅收費</a>、
      <a href="https://www.td.gov.hk/tc/transport_in_hong_kong/tunnels_and_bridges_n/tlt/index.html" target="_blank" rel="noopener">大欖隧道</a>。
      資料僅供參考，實際收費以運輸署公布為準。
    </footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
